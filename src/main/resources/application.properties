spring.application.name=capstone-server

# 프론트 주소 (쉼표로 여러 개). 배포 주소가 바뀌면 여기만 고친다
app.cors.allowed-origins=https://demo-site-mu-liart.vercel.app

# 헬스체크: 배포 후 GET /actuator/health 가 {"status":"UP"} 인지 본다. health 말고는 열지 않는다
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# 금리 자동 갱신 (통장·일반 적금·마이너스·대출 기본 금리, market/MarketRateService)
# 한국은행 ECOS Open API 키를 환경변수 ECOS_API_KEY로 넣는다 (신청: https://ecos.bok.or.kr/api). 키가 없으면 params.json·코드 기본값 그대로
app.market.ecos-api-key=${ECOS_API_KEY:}
# 서버가 켜지고 3초 뒤 한 번, 그 뒤 매일 아침 7시(한국 시간)에 받는다. 한국은행은 보통 다음 달 말에 전달 금리를 발표한다
app.market.refresh-cron=0 0 7 * * *
