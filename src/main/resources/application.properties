spring.application.name=capstone-server

# 프론트 주소 (쉼표로 여러 개). 배포 주소가 바뀌면 여기만 고친다
app.cors.allowed-origins=https://demo-site-mu-liart.vercel.app

# 헬스체크: 배포 후 GET /actuator/health 가 {"status":"UP"} 인지 본다. health 말고는 열지 않는다
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
