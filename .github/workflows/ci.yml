name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# 같은 PR에 새 커밋이 오면 이전 실행은 취소한다
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (golden 포함)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 배포판·의존성 캐시
      - uses: gradle/actions/setup-gradle@v5

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Test summary
        if: always()
        run: |
          dir=build/test-results/test
          if ! ls "$dir"/*.xml >/dev/null 2>&1; then
            echo "테스트 결과 파일이 없습니다 (컴파일 실패 가능성)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sum() { grep -ho "$1=\"[0-9]*\"" "$dir"/*.xml | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}'; }
          {
            echo "### 테스트 결과"
            echo "| 전체 | 실패 | 에러 | 건너뜀 |"
            echo "|---|---|---|---|"
            echo "| $(sum 'tests') | $(sum 'failures') | $(sum 'errors') | $(sum 'skipped') |"
            echo
            echo "정답 파일 대조: \`EngineGoldenTest\`(golden.json), \`AnalysisGoldenTest\`(analysis_golden.json)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7

  docker:
    name: Docker build + smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Render가 쓰는 것과 같은 Dockerfile로 이미지를 만든다. 푸시는 하지 않는다
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: capstone-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 컨테이너를 실제로 띄워서 응답이 오는지 본다 (CD 헬스체크와 같은 방식)
      - name: Smoke test
        run: |
          docker run -d --name app -p 8080:8080 -e PORT=8080 capstone-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/meta > /dev/null; then
              echo "GET /api/meta 200 (${i}회째 시도)"
              exit 0
            fi
            sleep 2
          done
          echo "60초 안에 서버가 응답하지 않았습니다"
          exit 1

      - name: Container logs
        if: always()
        run: docker logs app 2>&1 | tail -100 || true
