name: Deploy

# main에서 CI가 통과하면 EC2에 배포한다. 수동 실행으로 예전 커밋 이미지를 다시 배포(롤백)할 수도 있다.
#
# 접근 제어: AWS 키를 저장하지 않는다. 작업마다 GitHub OIDC 토큰으로 IAM 역할의 임시 자격 증명을 받는다.
#            역할은 이 레포의 production 환경에서만 받을 수 있다 (infra/aws/github-actions-deploy-trust.json).
# 증적:      이미지 태그 = 커밋 SHA, ECR 태그 덮어쓰기 금지, SSM 명령 기록, 실행 요약에 배포 기록.
#
# 필요한 설정 (Settings → Environments → production → Environment variables)
#   AWS_REGION       예) ap-southeast-2
#   AWS_ROLE_ARN     예) arn:aws:iam::123456789012:role/github-actions-deploy
#   ECR_REPOSITORY   예) capstone-backend
#   EC2_INSTANCE_ID  예) i-0123456789abcdef0
#   DEPLOY_BASE_URL  예) http://3.25.0.1
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      git_sha:
        description: '배포할 커밋 SHA (비우면 main 최신). 예전 SHA를 넣으면 그 버전으로 롤백'
        required: false

# 배포는 한 번에 하나씩. 진행 중인 배포는 취소하지 않는다
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # OIDC 토큰 발급

jobs:
  deploy:
    # 자동 배포는 저장소 변수 DEPLOY_ENABLED=true 일 때만. AWS 설정 전에는 건너뛴다(빨간불 없음)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.DEPLOY_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.DEPLOY_BASE_URL }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      BASE_URL: ${{ vars.DEPLOY_BASE_URL }}
      GIT_SHA: ${{ inputs.git_sha || github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.GIT_SHA }}

      - name: Check config
        run: |
          for v in AWS_REGION ECR_REPOSITORY INSTANCE_ID BASE_URL; do
            [ -n "${!v}" ] || { echo "::error::production 환경 변수 $v 가 비어 있습니다"; exit 1; }
          done
          echo "SHORT_SHA=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Resolve image
        id: image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:$SHORT_SHA"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          # 태그를 덮어쓸 수 없으니(Immutable) 이미 있으면 빌드를 건너뛰고 그대로 배포한다 (재실행·롤백)
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$SHORT_SHA" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "이미 ECR에 있는 이미지: $IMAGE"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.image.outputs.exists == 'false'

      - name: Build and push
        if: steps.image.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64   # t3.small(x86). t4g(ARM)로 바꾸면 linux/arm64
          tags: ${{ steps.image.outputs.image }}
          labels: |
            org.opencontainers.image.revision=${{ env.GIT_SHA }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2 (SSM)
        id: ssm
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          # 변수 세 줄 + 배포 스크립트를 한 덩어리로 보낸다
          { printf 'REGION=%q\nREGISTRY=%q\nIMAGE=%q\n' "$AWS_REGION" "$REGISTRY" "$IMAGE"; cat scripts/deploy/ec2-deploy.sh; } > /tmp/deploy.sh
          jq -n --rawfile s /tmp/deploy.sh '{commands: [$s], executionTimeout: ["600"]}' > /tmp/params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $SHORT_SHA by ${{ github.actor }} (run ${{ github.run_id }})" \
            --parameters file:///tmp/params.json \
            --query Command.CommandId --output text)
          echo "SSM 명령 ID: $CMD_ID"
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"

          # 끝날 때까지 기다린다 (최대 약 10분)
          for i in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          [ "$STATUS" = "Success" ] || { echo "::error::서버 배포 실패 ($STATUS). 서버가 롤백을 시도했습니다. 위 로그를 확인하세요"; exit 1; }

      # 서버 안에서 통과해도 밖에서 안 보이면(보안 그룹 등) 실패로 본다
      - name: External health check
        run: |
          url="${BASE_URL%/}/actuator/health"
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 "$url"; then echo; echo "외부 헬스체크 통과: $url"; exit 0; fi
            sleep 3
          done
          echo "::error::밖에서 $url 에 접속되지 않습니다. 보안 그룹의 HTTP(80) 규칙을 확인하세요"
          exit 1

      - name: Deployment record
        if: always()
        run: |
          {
            echo "### 배포 기록"
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 결과 | ${{ job.status }} |"
            echo "| 커밋 | \`$GIT_SHA\` |"
            echo "| 이미지 | \`${{ steps.image.outputs.image }}\` (새로 빌드: ${{ steps.image.outputs.exists == 'false' }}) |"
            echo "| 실행한 사람 | ${{ github.actor }} (${{ github.event_name }}) |"
            echo "| 대상 | $INSTANCE_ID ($AWS_REGION) |"
            echo "| SSM 명령 ID | ${{ steps.ssm.outputs.command_id }} |"
            echo "| 시각(UTC) | $(date -u +%FT%TZ) |"
          } >> "$GITHUB_STEP_SUMMARY"
